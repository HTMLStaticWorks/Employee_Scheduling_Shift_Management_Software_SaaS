<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | ShiftFlow</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/auth.css">

    <style>
      /* Keep authentication brand identical to the homepage brand */
      .auth-brand a {
        color: var(--color-primary) !important;
        font-family: var(--font-primary) !important;
        font-size: 1.5rem !important;
        font-weight: 800 !important;
        letter-spacing: -0.5px;
      }
      .auth-brand a span, .auth-brand a span span { color: var(--color-primary) !important; }
      .auth-brand .brand-icon { color: var(--color-primary) !important; }
    </style>
</head>

<body>
  <!-- Top Right Icons -->
  <div style="position: absolute; top: 1rem; right: 1rem; display: flex; gap: 0.5rem; z-index: 100;">
    <button class="btn-icon rtl-toggle" id="rtlToggle" aria-label="Toggle RTL" title="Toggle RTL">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
        stroke-linejoin="round">
        <path d="M17 11H3M17 11L13 7M17 11L13 15M7 17H21M7 17L11 13M7 17L11 21" />
      </svg>
    </button>
    <button class="btn-icon theme-toggle" aria-label="Toggle Theme" title="Toggle Theme">
      <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
      </svg>
      <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round" style="display:none;">
        <circle cx="12" cy="12" r="5" />
        <path
          d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" />
      </svg>
    </button>
  </div>

  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-brand">
        <a href="index.html">
          <svg class="brand-icon" style="width:28px;height:28px;background:none;box-shadow:none;color:var(--primary);"
            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" />
          </svg>
          <span>Shift<span>Flow</span></span>
        </a>
      </div>

      <div class="auth-header">
        <h1>Welcome <span>back</span></h1>
        <p>Log in to manage your team schedules.</p>
      </div>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="email">Work Email</label>
          <div class="input-box">
            <input type="email" id="email" placeholder="you@company.com" required>
          </div>
        </div>

        <div class="form-group">
          <div class="password-label">
            <label for="password">Password</label>
          </div>
          <div class="input-box">
            <input type="password" id="password" placeholder="••••••••" required>
            <button type="button" class="password-toggle" id="passwordToggle">Show</button>
          </div>
        </div>

        <div class="remember-row">
          <label class="remember">
            <input type="checkbox"> Remember me
          </label>
          <a href="#">Forgot password?</a>
        </div>

        <button type="submit" class="auth-btn">
          <span>Login</span> &rarr;
        </button>

        <div class="divider">OR CONTINUE WITH</div>

        <div style="display: flex; flex-direction: column; gap: 10px;">
          <button type="button" class="google-btn">
            <svg class="google-icon" style="background:transparent;width:18px;height:18px" viewBox="0 0 24 24">
              <path fill="#4285F4"
                d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
              <path fill="#34A853"
                d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
              <path fill="#FBBC05"
                d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
              <path fill="#EA4335"
                d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
            </svg>
            Google
          </button>

          <button type="button" class="google-btn">
            <svg style="width:18px;height:18px" viewBox="0 0 24 24" fill="#1877F2">
              <path
                d="M24 12.07C24 5.41 18.63 0 12 0S0 5.4 0 12.07C0 18.1 4.39 23.1 10.13 24v-8.44H7.08v-3.49h3.04V9.41c0-3.02 1.8-4.7 4.54-4.7 1.31 0 2.68.24 2.68.24v2.97h-1.5c-1.5 0-1.96.93-1.96 1.89v2.26h3.32l-.53 3.5h-2.8V24C19.62 23.1 24 18.1 24 12.07z" />
            </svg>
            Facebook
          </button>

          <button type="button" class="google-btn">
            <svg style="width:18px;height:18px" viewBox="0 0 384 512" fill="#000">
              <path
                d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z" />
            </svg>
            Apple
          </button>
        </div>
      </form>

      <div class="auth-footer">
        <p>Don't have an account? <a href="signup.html">Sign up</a></p>
      </div>
    </div>


  </div>

  <script src="assets/js/main.js"></script>
  <script src="assets/js/auth.js"></script>
</body>

</html>
